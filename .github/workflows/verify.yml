name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Diff sanity
        run: git diff --check
      - name: Install pnpm
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install --global pnpm@11.20.0
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Typecheck
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm run --if-present typecheck
      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          typecheck=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.typecheck ?? ''")
          lint=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.lint ?? ''")
          if [[ -n "$lint" && "$lint" != "$typecheck" ]]; then
            pnpm run lint
          else
            echo "Skipping duplicate or absent lint script"
          fi
      - name: Test
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm run --if-present test
